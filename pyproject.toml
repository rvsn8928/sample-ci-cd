[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-churn-prediction"
version = "0.1.0"
description = "Python implementation of the employee churn Decision Tree and Random Forest notebook"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
