name: Employee Churn CI

on:
  push:
    branches: ["main", "master","feature1"]
  pull_request:
    branches: ["main", "master","feature1"]

permissions:
  contents: read

jobs:

  train:
    name: Train models
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Check dataset availability
        id: dataset
        shell: bash
        run: |
          if [ -f "data/employee_data.csv" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Dataset not found. Training step will be skipped."
          fi

      - name: Train Decision Tree and Random Forest
        if: steps.dataset.outputs.available == 'true'
        run: python scripts/train.py --data data/employee_data.csv --output outputs
        
      - name: EDA
        run: python scripts/eda.py --data data/employee_data.csv

      - name: Upload model outputs
        if: steps.dataset.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: employee-churn-model-outputs
          path: outputs/
          if-no-files-found: error
